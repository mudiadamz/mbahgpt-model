# =====================================================================
# mbahgpt.com -> server.py di 127.0.0.1:8000
#
# Dipasang oleh ./install-site.sh ke /etc/nginx/sites-available/mbahgpt.com.
# Blok TLS di bawah menunjuk ke sertifikat Let's Encrypt, jadi nginx TIDAK BISA
# start sebelum sertifikatnya ada — install-site.sh menerbitkannya lebih dulu
# lewat webroot ACME milik catch-all (lihat /etc/nginx/conf.d/20-vhost.conf).
#
# Pembagian tugas dengan server.py: nginx yang memegang TLS, nama domain, dan
# penyaringan bot; Python yang memegang autentikasi token, CSP ber-nonce, dan
# rate limit per klien. Header keamanan aplikasi TIDAK diduplikasi di sini —
# CSP-nya dibuat ulang per response dengan nonce dan akan rusak kalau ditimpa.
# =====================================================================

# --- port 80: hanya ACME dan pengalihan ke HTTPS ---------------------
server {
    listen      80;
    listen [::]:80;
    server_name mbahgpt.com www.mbahgpt.com;

    # Perpanjangan sertifikat memakai webroot yang sama dengan penerbitan
    # pertama. Harus di atas redirect: token ACME diminta lewat http polos.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        access_log off;
    }

    location / { return 301 https://mbahgpt.com$request_uri; }
}

# --- www -> apex, supaya hanya ada satu origin ------------------------
# Satu origin bukan soal SEO di sini, tapi soal cookie: token disimpan sebagai
# cookie SameSite=Strict per host, dan dua nama berarti dua sesi berbeda.
server {
    # nginx di mesin ini 1.24: HTTP/2 masih parameter listen. Direktif
    # "http2 on;" baru ada di 1.25.1 dan membuat 1.24 gagal start.
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mbahgpt.com;

    ssl_certificate     /etc/letsencrypt/live/mbahgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbahgpt.com/privkey.pem;

    return 301 https://mbahgpt.com$request_uri;
}

# --- situsnya ---------------------------------------------------------
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mbahgpt.com;

    ssl_certificate     /etc/letsencrypt/live/mbahgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbahgpt.com/privkey.pem;

    # Parameter TLS ditulis di sini, bukan meng-include berkas milik plugin
    # certbot-nginx: berkas itu hanya muncul kalau certbot dijalankan dengan
    # installer nginx, sedangkan di sini sertifikat diterbitkan mode certonly.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;      # TLS1.3: urutan klien yang menang
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # tiket tanpa rotasi melemahkan forward secrecy
    # ssl_stapling sengaja TIDAK dipakai: sertifikat Let's Encrypt sudah tidak
    # memuat URL OCSP responder, jadi nginx hanya mencatat peringatan "no OCSP
    # responder URL in the certificate" pada setiap reload tanpa manfaat apa pun.

    # Tanpa includeSubDomains: subdomain lain di mbahgpt.com belum tentu ber-TLS,
    # dan HSTS yang terlalu lebar mematikannya tanpa jalan mundur cepat.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mbahgpt.access.log antibot;
    error_log  /var/log/nginx/mbahgpt.error.log;

    # Penyaring dari conf.d/10-hardening.conf. Sekarang layanan ini menghadap
    # internet, jadi pemindai akan datang — tutup sebelum menyentuh Python.
    if ($block_ua)  { return 444; }
    if ($bad_path)  { return 444; }

    # 16m di 10-hardening.conf lebih longgar dari batas lampiran aplikasi
    # (OPENROUTER_MAX_UPLOAD, 8 MB); yang lebih ketat yang berlaku.
    client_max_body_size 10m;

    location / {
        limit_req  zone=perip burst=40 nodelay;
        limit_conn connperip 24;        # tiap tab chat memegang satu SSE

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Host diteruskan apa adanya: server.py mencocokkannya dengan
        # OPENROUTER_PUBLIC_HOST, dan Origin lintas situs harus tetap terlihat
        # asli supaya penjaga CSRF-nya masih bekerja. Menimpa keduanya dengan
        # 127.0.0.1 memang membuat proxy "jalan", tapi sekaligus mematikan
        # kedua penjaga itu.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # --- streaming ---------------------------------------------------
        # Jawaban model dikirim sebagai SSE. Dengan proxy_buffering on (default)
        # nginx menahan potongan sampai buffernya penuh: halaman diam lama, lalu
        # seluruh jawaban muncul sekaligus — efek streaming hilang total.
        proxy_buffering off;
        proxy_cache off;
        gzip off;                       # gzip juga menahan potongan kecil
        chunked_transfer_encoding on;

        # Satu giliran chat bisa lama: pencarian web + beberapa putaran tool di
        # atas OPENROUTER_TIMEOUT (120s). Batas di bawah harus lebih longgar
        # daripada itu, kalau tidak nginx memutus stream yang masih hidup.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    600s;
    }
}
